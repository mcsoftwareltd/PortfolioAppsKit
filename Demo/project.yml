name: PortfolioAppsDemo
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  PortfolioAppsKit:
    path: ..
targets:
  PortfolioAppsDemo:
    type: application
    platform: iOS
    sources:
      - PortfolioAppsDemo
    dependencies:
      - package: PortfolioAppsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcsoftware.PortfolioAppsDemo
        PRODUCT_NAME: PortfolioAppsDemo
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Portfolio Apps Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  PortfolioAppsDemo:
    build:
      targets:
        PortfolioAppsDemo: all
    run:
      config: Debug
